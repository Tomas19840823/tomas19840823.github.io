<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Your Waiter | Tipsy</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        .card { background: white; width: 100%; max-width: 380px; padding: 35px 25px; border-radius: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; }
        
        /* 1. AVATAR: Full Orange Circle */
        .avatar-container { width: 90px; height: 90px; margin: 0 auto 15px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #FF9800; box-sizing: border-box; }
        
        h2 { margin: 5px 0 0; color: #333; font-size: 1.8em; font-weight: 700; }
        p.location { color: #999; margin: 5px 0 25px; font-size: 1em; font-weight: 400; }

        /* 3. AMOUNT DISPLAY: Orange Color */
        .label-small { font-size: 0.85em; color: #999; font-weight: 500; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .amount-wrapper { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        
        /* Orange text */
        .currency { font-size: 2.8em; color: #FF9800; font-weight: bold; margin-right: 5px; }
        .amount-display { font-size: 3.5em; color: #bdbdbd; font-weight: bold; border: none; width: 220px; text-align: center; outline: none; background: transparent; transition: color 0.2s; }
        .amount-display.active { color: #FF9800; } /* Keep grey until typing/sliding? App shows grey 0.00 */
        
        /* 2. CUSTOM "STICK" SLIDERS */
        .slider-container { margin: 15px 0 30px; text-align: center; width: 100%; position: relative; height: 40px; display: flex; align-items: center; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            height: 100%; 
            z-index: 2;
            position: relative;
        }
        input[type=range]:focus { outline: none; }

        /* --- TIP SLIDER STYLES --- */
        /* Track */
        #tip-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 14px;
            border-radius: 7px;
            /* Gradient background is set by JS */
        }
        /* Stick Thumb */
        #tip-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 34px; /* Taller than track */
            width: 6px;   /* The Stick */
            border-radius: 3px;
            background: #EF6C00; /* Darker Orange Stick */
            margin-top: -10px; /* Center vertical */
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* --- RATING SLIDER STYLES --- */
        #rating-slider::-webkit-slider-runnable-track {
            width: 100%;
            height: 14px;
            border-radius: 7px;
        }
        #rating-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 34px;
            width: 6px; /* The Stick */
            border-radius: 3px;
            background: #0277BD; /* Darker Blue Stick */
            margin-top: -10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* RATINGS VALUE */
        .rating-val { font-size: 1.6em; color: #FF9800; font-weight: bold; display: block; margin: 5px 0 5px; }

        /* COMMENT BOX */
        .comment-box { width: 100%; padding: 15px; border: 1px solid #e0e0e0; border-radius: 15px; margin-bottom: 30px; font-family: inherit; font-size: 1em; color: #555; background: #fff; box-sizing: border-box; resize: none; outline: none; }
        .comment-box::placeholder { color: #bbb; }

        /* 5. SWIPE BUTTON */
        .swipe-container { position: relative; width: 100%; height: 60px; background: #eee; border-radius: 30px; overflow: hidden; cursor: pointer; }
        .swipe-text { line-height: 60px; color: #999; font-weight: bold; font-size: 1.1em; padding-left: 20px; z-index: 1; position: relative; pointer-events: none; }
        
        .swipe-btn { 
            width: 60px; height: 60px; 
            background: #FF9800; 
            border-radius: 50%; 
            position: absolute; top: 0; left: 0; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            z-index: 2;
            cursor: grab;
        }
        .swipe-arrow { color: white; font-size: 1.4em; font-weight: bold; pointer-events: none; }

        .hidden { display: none; }
        .swipe-btn.processing { width: 100%; border-radius: 30px; transition: width 0.3s; justify-content: center; }
        .swipe-btn.processing .swipe-arrow { display: none; }
        .swipe-btn.processing::after { content: 'Processing...'; color: white; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="card" id="loading"><h3>Loading...</h3></div>
<div class="card hidden" id="error-card"><h3 style="color:red">Waiter Not Found</h3></div>

<div class="card hidden" id="payment-card">
    
    <div class="avatar-container">
        <img id="waiter-img" src="" class="avatar">
    </div>
    <h2 id="waiter-name">Name</h2>
    <p class="location" id="restaurant-name">Location</p>

    <span class="label-small">I want to tip</span>
    <div class="amount-wrapper">
        <span class="currency">€</span>
        <input type="text" id="amount-text" class="amount-display" value="0.00" readonly>
    </div>

    <div class="slider-container">
        <input type="range" id="tip-slider" min="0" max="20" step="0.5" value="0" oninput="updateTipDisplay()">
    </div>

    <span class="label-small" style="margin-top:10px;">Rate experience</span>
    <span id="rating-val" class="rating-val">0.0</span>
    
    <div class="slider-container">
        <input type="range" id="rating-slider" min="0" max="5" step="0.1" value="0" oninput="updateRatingDisplay()">
    </div>

    <textarea id="comment" class="comment-box" rows="2" placeholder="Add a comment..."></textarea>

    <div class="swipe-container" id="swipe-track">
        <div class="swipe-btn" id="swipe-btn">
            <span class="swipe-arrow">➜</span>
        </div>
        <div class="swipe-text">Swipe to Pay >>></div>
    </div>
</div>

<script>
    const API_BASE = "https://api.tipsy.lt/api"; 
    const urlParams = new URLSearchParams(window.location.search);
    const waiterId = urlParams.get('id');

    if (waiterId) fetchWaiter(waiterId);
    else document.getElementById('error-card').classList.remove('hidden');

    async function fetchWaiter(id) {
        try {
            const res = await fetch(`${API_BASE}/waiter/${id}`);
            if (!res.ok) throw new Error();
            const w = await res.json();
            
            document.getElementById('waiter-name').innerText = w.name;
            document.getElementById('restaurant-name').innerText = w.restaurant_id || "Unknown Location";
            document.getElementById('waiter-img').src = w.imageUrl || "https://cdn-icons-png.flaticon.com/512/847/847969.png";
            
            // Initialize Sliders colors
            updateTipDisplay();
            updateRatingDisplay();

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('payment-card').classList.remove('hidden');
        } catch { document.getElementById('error-card').classList.remove('hidden'); }
    }

    // --- SLIDER LOGIC ---
    function updateSliderBackground(slider, filledColor, emptyColor) {
        const val = slider.value;
        const min = slider.min ? slider.min : 0;
        const max = slider.max ? slider.max : 100;
        const percentage = ((val - min) / (max - min)) * 100;
        
        slider.style.background = `linear-gradient(to right, ${filledColor} 0%, ${filledColor} ${percentage}%, ${emptyColor} ${percentage}%, ${emptyColor} 100%)`;
    }

    function updateTipDisplay() {
        const slider = document.getElementById('tip-slider');
        const display = document.getElementById('amount-text');
        
        // Update Text
        display.value = parseFloat(slider.value).toFixed(2);
        
        // Update Color (Orange #FF9800, Light #FFE0B2)
        updateSliderBackground(slider, '#FFCC80', '#FFF3E0');
        
        // Text Color Logic
        if (parseFloat(slider.value) > 0) {
            display.style.color = "#FF9800"; // Active Dark
        } else {
            display.style.color = "#bdbdbd"; // Inactive Grey
        }
    }

    function updateRatingDisplay() {
        const slider = document.getElementById('rating-slider');
        
        // Update Text
        document.getElementById('rating-val').innerText = parseFloat(slider.value).toFixed(1);
        
        // Update Color (Blue #29B6F6, Light #E1F5FE)
        updateSliderBackground(slider, '#B3E5FC', '#E1F5FE');
    }

    // --- SWIPE LOGIC ---
    const btn = document.getElementById('swipe-btn');
    const track = document.getElementById('swipe-track');
    let isDragging = false;
    let startX, currentX;
    let maxSwipe = 0;

    // Mouse
    btn.addEventListener('mousedown', startSwipe);
    document.addEventListener('mousemove', moveSwipe);
    document.addEventListener('mouseup', endSwipe);

    // Touch
    btn.addEventListener('touchstart', startSwipe, {passive: false});
    document.addEventListener('touchmove', moveSwipe, {passive: false});
    document.addEventListener('touchend', endSwipe);

    function startSwipe(e) {
        if (btn.classList.contains('processing')) return;
        isDragging = true;
        startX = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
        maxSwipe = track.offsetWidth - btn.offsetWidth;
        btn.style.transition = 'none'; 
    }

    function moveSwipe(e) {
        if (!isDragging) return;
        
        const clientX = (e.type === 'touchmove') ? e.touches[0].clientX : e.clientX;
        let delta = clientX - startX;

        if (delta < 0) delta = 0;
        if (delta > maxSwipe) delta = maxSwipe;

        currentX = delta;
        btn.style.transform = `translateX(${delta}px)`;
        if(e.type === 'touchmove') e.preventDefault(); 
    }

    function endSwipe() {
        if (!isDragging) return;
        isDragging = false;
        btn.style.transition = 'transform 0.3s ease'; 

        if (currentX > maxSwipe * 0.85) {
            btn.style.transform = `translateX(${maxSwipe}px)`;
            initiatePayment();
        } else {
            btn.style.transform = `translateX(0px)`; 
        }
    }

    async function initiatePayment() {
        const amount = parseFloat(document.getElementById('amount-text').value);
        if (amount <= 0) { 
            alert("Please select a tip amount"); 
            btn.style.transform = `translateX(0px)`;
            return; 
        }
        
        btn.classList.add('processing');
        
        const rating = parseFloat(document.getElementById('rating-slider').value);
        const comment = document.getElementById('comment').value;

        try {
            const res = await fetch(`${API_BASE}/payment/initiate-simple`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender_id: 0, 
                    waiter_id: waiterId,
                    amount: Math.round(amount * 100),
                    rating: Math.round(rating),
                    comment: comment
                })
            });
            const data = await res.json();
            if (data.success && data.payment_url) {
                window.location.href = data.payment_url;
            } else { 
                alert("Error: " + (data.error || "Unknown"));
                resetBtn();
            }
        } catch { 
            alert("Connection Failed"); 
            resetBtn();
        }
    }

    function resetBtn() {
        btn.classList.remove('processing');
        btn.style.transform = `translateX(0px)`;
    }
</script>
</body>
</html>

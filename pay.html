<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipsy - Send a Tip</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF9800;
            --deep-orange: #F57C00;
            --bg-color: #f5f7fa;
            --text-color: #333;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- PROFILE SECTION --- */
        .profile-section {
            text-align: center;
            margin-bottom: 20px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-orange);
            background-color: #eee;
            margin-bottom: 10px;
        }
        .pro-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: #2D2D2D;
        }
        .pro-location {
            color: #757575;
            font-size: 0.9rem;
        }

        /* --- PAYMENT CARD --- */
        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .label {
            color: #9E9E9E;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: block;
        }

        /* AMOUNT INPUT */
        .amount-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }
        .currency {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--deep-orange);
            margin-right: 5px;
        }
        #amount-input {
            font-size: 3rem;
            font-weight: 700;
            color: var(--deep-orange);
            border: none;
            width: 140px;
            text-align: center;
            outline: none;
        }

        /* TOTAL CHARGE TEXT (NEW) */
        #total-display {
            font-size: 0.85rem;
            color: #757575;
            font-weight: 600;
            margin-bottom: 20px;
            height: 20px; /* Prevent layout jump */
        }

        /* SLIDER */
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #FFCC80;
            outline: none;
            margin-bottom: 25px;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-orange);
            cursor: pointer;
        }

        .divider {
            height: 1px;
            background-color: #EEEEEE;
            margin: 20px 0;
            width: 100%;
        }

        /* RATING */
        .stars {
            font-size: 2rem;
            color: #e0e0e0;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .star.active {
            color: var(--primary-orange);
        }

        /* COMMENT */
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E0E0E0;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 25px;
        }
        textarea:focus {
            border-color: var(--primary-orange);
            outline: none;
        }

        /* BUTTON */
        .btn-pay {
            background: linear-gradient(90deg, #FF9800, #F57C00);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
            transition: transform 0.2s;
        }
        .btn-pay:active {
            transform: scale(0.98);
        }
        .btn-pay:disabled {
            background: #ccc;
            box-shadow: none;
        }

        /* ERROR/STATUS */
        #status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="profile-section">
        <img src="" id="pro-image" class="profile-img" alt="Pro" onerror="this.src='https://via.placeholder.com/120?text=Pro'">
        <h1 class="pro-name" id="pro-name">Loading...</h1>
        <p class="pro-location" id="pro-location">...</p>
    </div>

    <div class="card">
        <span class="label">I want to tip</span>
        
        <div class="amount-wrapper">
            <span class="currency">€</span>
            <input type="number" id="amount-input" value="0.00" step="0.50" oninput="updateFromInput()">
        </div>

        <div id="total-display">Total charged: €0.00 (incl. 7% fee)</div>

        <input type="range" min="0" max="20" step="0.5" value="0" class="slider" id="tip-slider" oninput="updateFromSlider()">

        <div class="divider"></div>

        <span class="label">Rate experience</span>
        <div class="stars" id="star-container">
            <span class="star" onclick="setRating(1)">★</span>
            <span class="star" onclick="setRating(2)">★</span>
            <span class="star" onclick="setRating(3)">★</span>
            <span class="star" onclick="setRating(4)">★</span>
            <span class="star" onclick="setRating(5)">★</span>
        </div>
        <div id="rating-text" style="color: var(--primary-orange); font-weight: bold; margin-bottom: 15px; font-size: 1.2rem;">0.0</div>

        <textarea id="comment" rows="2" placeholder="Add a comment..."></textarea>

        <button class="btn-pay" id="pay-btn" onclick="initiatePayment()">Pay with Bank</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_BASE = "https://tipsy.lt/api"; // Or your specific IP if testing locally
        let currentWaiterId = null;
        let currentRating = 0;

        // 1. ON LOAD: GET WAITER ID FROM URL
        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (id) {
                currentWaiterId = id;
                await fetchWaiterDetails(id);
            } else {
                document.getElementById('pro-name').innerText = "No Professional Selected";
                document.getElementById('pay-btn').disabled = true;
            }
        };

        // 2. FETCH DETAILS
        async function fetchWaiterDetails(id) {
            try {
                const response = await fetch(`${API_BASE}/waiter/${id}`);
                const data = await response.json();

                if (data.error) {
                    alert("Professional not found");
                    return;
                }

                document.getElementById('pro-name').innerText = data.name;
                document.getElementById('pro-location').innerText = data.restaurant_id || "Unknown Location";
                
                if (data.imageUrl) {
                    document.getElementById('pro-image').src = data.imageUrl;
                }
            } catch (e) {
                console.error(e);
                document.getElementById('pro-name').innerText = "Error loading profile";
            }
        }

        // 3. UI LOGIC (SLIDER & MATH)
        const slider = document.getElementById('tip-slider');
        const input = document.getElementById('amount-input');
        const totalDisplay = document.getElementById('total-display');

        function updateFromSlider() {
            let val = parseFloat(slider.value);
            input.value = val.toFixed(2);
            calculateTotal(val);
        }

        function updateFromInput() {
            let val = parseFloat(input.value);
            if (val > 50) val = 50; // Max limit
            if (isNaN(val)) val = 0;
            slider.value = val;
            calculateTotal(val);
        }

        // --- NEW: FEE CALCULATION LOGIC ---
        function calculateTotal(tipAmount) {
            if (tipAmount <= 0) {
                totalDisplay.innerText = "";
                return;
            }
            
            // 7% Fee logic
            let fee = tipAmount * 0.07;
            let total = tipAmount + fee;

            totalDisplay.innerText = `Total charged: €${total.toFixed(2)} (incl. 7% fee)`;
        }

        function setRating(n) {
            currentRating = n;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < n) star.classList.add('active');
                else star.classList.remove('active');
            });
            document.getElementById('rating-text').innerText = n.toFixed(1);
        }

        // 4. PAYMENT LOGIC
        async function initiatePayment() {
            const tipVal = parseFloat(input.value);
            if (tipVal <= 0) {
                alert("Please select a tip amount");
                return;
            }

            const btn = document.getElementById('pay-btn');
            const status = document.getElementById('status-msg');
            
            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "";

            try {
                // Convert to cents for API
                const amountCents = Math.round(tipVal * 100);
                const commentText = document.getElementById('comment').value;

                // Send ONLY tip amount (Backend adds fee)
                const payload = {
                    sender_id: 0, // 0 for Guest
                    waiter_id: currentWaiterId,
                    amount: amountCents,
                    rating: currentRating,
                    comment: commentText
                };

                const response = await fetch(`${API_BASE}/payment/initiate-simple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.success && result.payment_url) {
                    status.style.color = "green";
                    status.innerText = "Redirecting to bank...";
                    window.location.href = result.payment_url;
                } else {
                    throw new Error(result.error || "Payment failed");
                }

            } catch (e) {
                console.error(e);
                status.style.color = "red";
                status.innerText = "Error: " + e.message;
                btn.disabled = false;
                btn.innerText = "Pay with Bank";
            }
        }
    </script>
</body>
</html>
